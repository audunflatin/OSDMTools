<!DOCTYPE html>
<html lang="no" translate="no">
<head>
  <meta charset="UTF-8" />
  <title>OSDMTools</title>

  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/favicon-192x192.png">

  <link rel="stylesheet" href="/static/styles.css?v=29">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('poptoosdm_theme')||'dark')</script>
</head>
<body>

<!-- SIDEBAR -->

<!-- APP_HEADER -->

<div class="container">

  <section class="panel">
    <h2 data-i18n="section_upload">Last opp OSDM-fil</h2>
    <p class="panel-desc" data-i18n="upload_description">
      Last opp en generert OSDM fareDelivery JSON-fil. Filen konverteres til en Excel-fil med alle stasjonsrelasjoner og priser per billettkategori.
    </p>

    <label data-i18n="label_osdm_file">OSDM JSON-fil</label>
    <input id="osdmFile" type="file" accept=".json" />
    <div id="fileInfo" style="display:none;"></div>

    <button id="convertBtn" class="btn-primary" onclick="convert()" disabled data-i18n="btn_convert">
      Konverter til Excel
    </button>
    <div id="convertProgress" class="upload-progress" style="display:none;"></div>

    <div id="resultBox" class="status-ok" style="display:none;">
      <div id="finalStatus" class="result-text"></div>
    </div>

    <button id="downloadBtn" onclick="download()" disabled data-i18n="btn_download_excel">
      Last ned Excel
    </button>
  </section>

</div>

<script src="/static/i18n.js?v=58"></script>
<script src="/static/common.js?v=3"></script>
<script src="/static/osdmtoExcel.js?v=8"></script>
</body>
</html>
