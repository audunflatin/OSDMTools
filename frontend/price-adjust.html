<!DOCTYPE html>
<html lang="no" translate="no">
<head>
  <meta charset="UTF-8" />
  <title>OSDMTools – Prisregulering</title>

  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/favicon-512x512.png">

  <link rel="stylesheet" href="/static/styles.css?v=28">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('poptoosdm_theme')||'dark')</script>
</head>
<body>

<!-- SIDEBAR -->

<!-- APP_HEADER -->

<div class="container">
  <section class="panel">
    <h2 data-i18n="heading_price_adjust">Prisregulering</h2>
    <p style="color:var(--text-muted); margin-bottom:1.75rem;" data-i18n="price_adjust_desc">
      Last opp en OSDM-fil og juster prisene med en fast prosentsats.
    </p>

    <label for="osdmFile" data-i18n="label_osdm_file">OSDM JSON-fil</label>
    <input type="file" id="osdmFile" accept=".json" onchange="validateOsdmFile()" />
    <div id="osdmProgress" style="display:none; margin-top:0.75rem;">
      <div style="height:6px; background:var(--spinner-ring); border-radius:3px; overflow:hidden;">
        <div class="progress-fill" style="height:100%; background:#ff5959; border-radius:3px; transition:width 0.5s ease; width:0%;"></div>
      </div>
      <div style="display:flex; gap:0.75rem; align-items:center; margin-top:0.4rem; font-size:0.8rem; color:var(--text-muted);">
        <span class="spinner-sm"></span>
        <span class="progress-pct">0%</span>
        <span class="progress-stage"></span>
      </div>
    </div>
    <div id="osdmSummary"></div>
    <div id="osdmWarnings"></div>

    <div class="pct-row">
      <div>
        <label for="adjustPct" data-i18n="label_adjust_pct">Prisendring (%)</label>
        <input type="number" id="adjustPct" step="0.1" data-i18n-placeholder="placeholder_adjust_pct" />
      </div>
      <div class="factor-display" id="factorDisplay" style="display:none;">
        <span data-i18n="label_factor">Faktor</span>: <span id="factorVal"></span>
      </div>
    </div>

    <div id="deliveryFields" style="display:none;">
      <hr class="step-sep">

      <label data-i18n="label_delivery_id">DeliveryId</label>
      <input id="deliveryId" type="text" required />

      <label data-i18n="label_previous_delivery_id">Previous DeliveryId <span style="opacity:0.5;font-weight:normal;">(valgfri)</span></label>
      <input id="previousDeliveryId" type="text" data-i18n-placeholder="placeholder_previous_delivery_id" />

      <label data-i18n="label_environment">Miljø</label>
      <select id="environment">
        <option value="prod" data-i18n="opt_production">Produksjon</option>
        <option value="test" data-i18n="opt_test">Test</option>
      </select>

      <label data-i18n="label_optional_delivery">Optional delivery</label>
      <select id="optionalDelivery">
        <option value="false" selected data-i18n="opt_no">Nei</option>
        <option value="true" data-i18n="opt_yes">Ja</option>
      </select>

      <label data-i18n="label_valid_from">Gyldig fra</label>
      <input id="validFrom" type="date" required />

      <label data-i18n="label_valid_to">Gyldig til</label>
      <input id="validTo" type="date" required />

      <div id="validationError" class="validation-error" style="display:none;"></div>

      <button class="btn-primary" id="adjustBtn" data-i18n="btn_adjust">Juster priser</button>
      <div id="spinnerAdjust" class="spinner"></div>

      <div id="resultBox" class="status-ok" style="display:none;">
        <div id="finalStatus" class="result-text"></div>
      </div>

      <button id="downloadBtn" onclick="downloadAdjusted()" disabled data-i18n="btn_download">
        Last ned OSDM JSON
      </button>
      <button id="downloadExcelBtn" onclick="downloadAdjustedExcel()" disabled data-i18n="btn_download_excel">
        Last ned Excel
      </button>
      <div id="spinnerExcel" class="spinner"></div>
    </div>
  </section>
</div>

<script src="/static/i18n.js?v=57"></script>
<script src="/static/common.js?v=2"></script>
<script src="/static/priceAdjust.js?v=11"></script>
</body>
</html>
