<!DOCTYPE html>
<html lang="no" translate="no">
<head>
  <meta charset="UTF-8" />
  <title>OSDMTools – Rydd opp i OSDM</title>

  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/favicon-192x192.png">

  <link rel="stylesheet" href="/static/styles.css?v=28">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('poptoosdm_theme')||'dark')</script>
</head>
<body>

<!-- SIDEBAR -->

<!-- APP_HEADER -->

<div class="container">

  <section class="panel">
    <h2 data-i18n="heading_fix_osdm">Rydd opp i OSDM</h2>
    <p style="margin-top:0;" data-i18n="fix_osdm_desc">
      Last opp en OSDM fareDelivery JSON-fil for automatisk opprydding.
    </p>

    <label data-i18n="label_osdm_file">OSDM JSON-fil</label>
    <input id="fixOsdmFile" type="file" accept=".json" />

    <button id="fixBtn" onclick="doAnalyze()" disabled style="margin-top:1.5rem;" data-i18n="btn_fix_osdm">
      Analyser fil
    </button>

    <div id="fixProgress" style="display:none; margin-top:0.75rem;">
      <div style="height:6px; background:var(--spinner-ring); border-radius:3px; overflow:hidden;">
        <div id="fixProgressFill" class="progress-fill" style="height:100%; background:#ff5959; border-radius:3px; transition:width 0.4s ease; width:0%;"></div>
      </div>
      <div style="display:flex; gap:0.75rem; align-items:center; margin-top:0.4rem; font-size:0.8rem; color:var(--text-muted);">
        <span class="spinner-sm"></span>
        <span id="fixProgressPct" class="progress-pct">0%</span>
        <span id="fixProgressStage" class="progress-stage"></span>
      </div>
    </div>

    <div id="fixResult" style="margin-top:1.5rem;"></div>
  </section>

</div>

<script src="/static/i18n.js?v=57"></script>
<script src="/static/fixOsdm.js?v=3"></script>
</body>
</html>
