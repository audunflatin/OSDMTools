<!DOCTYPE html>
<html lang="no" translate="no">
<head>
  <meta charset="UTF-8" />
  <title>OSDMTools – Rydd opp i OSDM</title>

  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/favicon-192x192.png">

  <link rel="stylesheet" href="/static/styles.css?v=29">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('poptoosdm_theme')||'dark')</script>
</head>
<body>

<!-- SIDEBAR -->

<!-- APP_HEADER -->

<div class="container">

  <section class="panel">
    <h2 data-i18n="heading_fix_osdm">Rydd opp i OSDM</h2>
    <p class="panel-desc" data-i18n="fix_osdm_desc">
      Last opp en OSDM fareDelivery JSON-fil for automatisk opprydding.
    </p>

    <label data-i18n="label_osdm_file">OSDM JSON-fil</label>
    <input id="fixOsdmFile" type="file" accept=".json" />
    <div id="fileInfo" style="display:none;"></div>

    <button id="fixBtn" class="btn-primary" onclick="doAnalyze()" disabled data-i18n="btn_fix_osdm">
      Analyser fil
    </button>
    <div id="fixProgress" class="upload-progress" style="display:none;"></div>

    <div id="resultBox" class="status-ok" style="display:none;">
      <div id="finalStatus" class="result-text"></div>
    </div>

    <button id="downloadBtn" onclick="doDownload()" disabled data-i18n="btn_apply_fix">
      Last ned fikset fil
    </button>
  </section>

</div>

<script src="/static/i18n.js?v=60"></script>
<script src="/static/common.js?v=5"></script>
<script src="/static/fixOsdm.js?v=4"></script>
</body>
</html>
