<!DOCTYPE html>
<html lang="no" translate="no">
<head>
  <meta charset="UTF-8" />
  <title>OSDMTools – OSDM-editor</title>

  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/favicon-192x192.png">

  <link rel="stylesheet" href="/static/styles.css?v=28">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('poptoosdm_theme')||'dark')</script>

  <style>
    .editor-tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--border);
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      padding: 0.5rem 1.1rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--coral); border-bottom-color: var(--coral); }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .pc-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
    }
    .pc-row:last-child { border-bottom: none; }
    .pc-name { font-size: 0.9rem; font-weight: 600; }
    .pc-adult { font-size: 0.75rem; color: var(--coral); }
    .pc-ratio-input { width: 80px; }

    .rc-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .rc-table th { text-align: left; padding: 0.4rem 0.5rem; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border); }
    .rc-table td { padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--border); }
    .rc-table tr:last-child td { border-bottom: none; }

    .stat-row { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .stat-chip { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.8rem; font-size: 0.8rem; }
    .stat-chip strong { color: var(--coral); }

    .msg-ok  { color: #4caf50; font-size: 0.82rem; margin-top: 0.4rem; }
    .msg-err { color: var(--coral); font-size: 0.82rem; margin-top: 0.4rem; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

    .field-group { display: flex; flex-direction: column; gap: 0.25rem; }
    .field-group label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }

    .truncated-note { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem; font-style: italic; }
  </style>
</head>
<body>

<!-- SIDEBAR -->

<!-- APP_HEADER -->

<div class="container">
  <section class="panel">
    <h2 style="display:flex;align-items:center;gap:0.6rem;"><span data-i18n="heading_osdm_editor">OSDM-editor</span><span class="beta-tag" style="padding:2px 7px;line-height:1.6;">BETA</span></h2>
    <p style="margin-top:0;" data-i18n="editor_desc">Last opp en OSDM fareDelivery-fil for å redigere passasjerprofiler, leveransemetadata og strekningsrelasjoner.</p>

    <!-- File upload -->
    <label data-i18n="label_osdm_editor_file">OSDM JSON-fil</label>
    <input id="editorFile" type="file" accept=".json" onchange="onFileChange()" />
    <button id="loadBtn" onclick="loadFile()" disabled style="margin-top:1rem;" data-i18n="btn_load_file">Last inn fil</button>
    <div id="loadProgress" style="display:none; margin-top:0.75rem;">
      <div style="height:6px; background:var(--spinner-ring); border-radius:3px; overflow:hidden;">
        <div id="loadProgressFill" class="progress-fill" style="height:100%; background:#ff5959; border-radius:3px; transition:width 0.4s ease; width:0%;"></div>
      </div>
      <div style="display:flex; gap:0.75rem; align-items:center; margin-top:0.4rem; font-size:0.8rem; color:var(--text-muted);">
        <span class="spinner-sm"></span>
        <span id="loadProgressPct" class="progress-pct">0%</span>
      </div>
    </div>
    <div id="loadMsg" style="margin-top:0.5rem;"></div>

    <!-- Tabs (only shown after load) -->
    <div id="editorBody" style="display:none; margin-top:1.5rem;">
      <div class="editor-tabs">
        <button class="tab-btn active" onclick="showTab('overview')" id="tabOverview" data-i18n="editor_tab_overview">Oversikt</button>
        <button class="tab-btn" onclick="showTab('passengers')" id="tabPassengers" data-i18n="editor_tab_passengers">Passasjerprofiler</button>
        <button class="tab-btn" onclick="showTab('relations')" id="tabRelations" data-i18n="editor_tab_relations">Relasjoner</button>
        <button class="tab-btn" onclick="showTab('download')" id="tabDownload" data-i18n="editor_tab_download">Last ned</button>
      </div>

      <!-- TAB: Overview / Metadata -->
      <div id="paneOverview" class="tab-pane active">
        <div id="overviewStats" class="stat-row"></div>

        <h3 style="font-size:1rem; margin-bottom:0.75rem;">Metadata</h3>
        <div class="form-row">
          <div class="field-group">
            <label data-i18n="editor_delivery_id">Leveranse-ID</label>
            <input id="metaDeliveryId" type="text" />
          </div>
          <div class="field-group">
            <label data-i18n="editor_prev_delivery_id">Forrige leveranse-ID (valgfri)</label>
            <input id="metaPrevDeliveryId" type="text" />
          </div>
          <div class="field-group">
            <label data-i18n="editor_valid_from">Gyldig fra</label>
            <input id="metaValidFrom" type="date" />
          </div>
          <div class="field-group">
            <label data-i18n="editor_valid_until">Gyldig til</label>
            <input id="metaValidUntil" type="date" />
          </div>
          <div class="field-group">
            <label data-i18n="editor_usage">Bruk</label>
            <select id="metaUsage">
              <option value="PRODUCTION">PRODUCTION</option>
              <option value="TEST_ONLY">TEST_ONLY</option>
            </select>
          </div>
          <div class="field-group" style="justify-content:flex-end;">
            <label data-i18n="editor_optional">Valgfri leveranse</label>
            <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer; margin-top:0.25rem;">
              <input id="metaOptional" type="checkbox" style="width:auto;" />
              <span id="metaOptionalLabel"></span>
            </label>
          </div>
        </div>
        <button onclick="saveMetadata()" style="margin-top:1rem;" data-i18n="btn_save_metadata">Lagre metadata</button>
        <div id="metaMsg" style="margin-top:0.5rem;"></div>
      </div>

      <!-- TAB: Passenger profiles -->
      <div id="panePassengers" class="tab-pane">
        <div id="pcList"></div>
      </div>

      <!-- TAB: Relations -->
      <div id="paneRelations" class="tab-pane">
        <h3 style="font-size:1rem; margin-bottom:0.75rem;" data-i18n="editor_tab_relations">Relasjoner</h3>

        <div class="form-row" style="margin-bottom:1rem;">
          <div class="field-group">
            <label data-i18n="editor_from_uic">Fra UIC-kode</label>
            <input id="relFromUic" type="text" placeholder="f.eks. 7600100" />
          </div>
          <div class="field-group">
            <label data-i18n="editor_to_uic">Til UIC-kode</label>
            <input id="relToUic" type="text" placeholder="f.eks. 7600551" />
          </div>
          <div class="field-group">
            <label data-i18n="editor_adult_price">Voksenpris (EUR)</label>
            <input id="relAdultPrice" type="number" min="0.01" step="0.01" placeholder="f.eks. 24.80" />
          </div>
          <div class="field-group">
            <label data-i18n="editor_distance">Avstand (km)</label>
            <input id="relDistance" type="number" min="0" step="1" placeholder="f.eks. 188" />
          </div>
        </div>
        <button onclick="addRelation()" data-i18n="btn_add_relation">Legg til relasjon</button>
        <div id="relMsg" style="margin-top:0.5rem;"></div>

        <div id="rcTableWrap" style="margin-top:1.5rem; overflow-x:auto;"></div>
      </div>

      <!-- TAB: Download -->
      <div id="paneDownload" class="tab-pane" style="text-align:center; padding:2rem 0;">
        <a id="downloadBtn" href="/osdm-editor/download" class="btn" download style="display:inline-block; background:#ff5959; color:#fff; text-decoration:none; font-size:1rem; font-weight:700; padding:0.8rem 2rem; border-radius:6px;" data-i18n="btn_download_edited">Last ned redigert fil</a>
      </div>

    </div>
  </section>
</div>

<script src="/static/i18n.js?v=57"></script>
<script src="/static/osdmEditor.js?v=2"></script>
</body>
</html>
