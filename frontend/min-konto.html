<!DOCTYPE html>
<html lang="no" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OSDMTools – Min konto</title>

  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/favicon-512x512.png">

  <link rel="stylesheet" href="/static/styles.css?v=36">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('poptoosdm_theme')||'dark')</script>
</head>
<body>

<!-- SIDEBAR -->

<!-- APP_HEADER -->

<div class="container">

  <!-- Name section -->
  <section class="panel panel-narrow">
    <h2 data-i18n="account_name_heading">Ditt navn</h2>

    <div id="nameSuccess" class="success-msg" style="display:none;"></div>
    <div id="nameError" class="validation-error" style="display:none;"></div>

    <form id="nameForm">
      <label data-i18n="account_first_name">Fornavn</label>
      <input id="firstName" type="text" autocomplete="given-name" />

      <label data-i18n="account_last_name">Etternavn</label>
      <input id="lastName" type="text" autocomplete="family-name" />

      <button type="submit" data-i18n="account_save_name">Lagre navn</button>
    </form>
  </section>

  <!-- Password section -->
  <section class="panel panel-narrow">
    <h2 data-i18n="account_pw_heading">Endre passord</h2>

    <div id="pwSuccess" class="success-msg" style="display:none;"></div>
    <div id="pwError" class="validation-error" style="display:none;"></div>

    <form id="pwForm">
      <label data-i18n="change_pw_label">Nytt passord</label>
      <input id="password" type="password" required minlength="8" autocomplete="new-password" />

      <label data-i18n="change_pw_confirm">Bekreft passord</label>
      <input id="confirm" type="password" required minlength="8" autocomplete="new-password" />

      <button type="submit" data-i18n="change_pw_btn">Lagre passord</button>
    </form>
  </section>

  <!-- Delete account section -->
  <section class="panel panel-narrow panel-danger">
    <h2 data-i18n="account_delete_heading">Slett konto</h2>
    <p class="text-muted-sm" data-i18n="account_delete_desc">Dette sletter kontoen din og alle tilknyttede data permanent. Handlingen kan ikke angres.</p>

    <div id="deleteConfirmBox" class="confirm-box" style="display:none;">
      <p class="text-muted-sm" data-i18n="account_delete_confirm">Er du sikker? Kontoen og alle dine data slettes permanent.</p>
      <div class="button-row">
        <button id="confirmDeleteBtn" class="btn-primary" data-i18n="account_delete_confirm_btn">Ja, slett kontoen</button>
        <button id="cancelDeleteBtn" data-i18n="account_delete_cancel">Avbryt</button>
      </div>
    </div>

    <button id="deleteBtn" class="btn-danger" data-i18n="account_delete_btn">Slett min konto</button>
  </section>

</div>

<script src="/static/i18n.js?v=66"></script>
<script>

  // Load current name
  (async () => {
    const r = await fetch("/account");
    if (!r.ok) return;
    const d = await r.json();
    if (d.first_name) document.getElementById("firstName").value = d.first_name;
    if (d.last_name)  document.getElementById("lastName").value  = d.last_name;
  })();

  // Save name
  document.getElementById("nameForm").onsubmit = async e => {
    e.preventDefault();
    const successEl = document.getElementById("nameSuccess");
    const errorEl   = document.getElementById("nameError");
    successEl.style.display = "none";
    errorEl.style.display   = "none";

    const fd = new FormData();
    fd.append("first_name", document.getElementById("firstName").value.trim());
    fd.append("last_name",  document.getElementById("lastName").value.trim());

    const r   = await fetch("/account/name", { method: "POST", body: fd });
    const res = await r.json().catch(() => ({}));

    if (r.ok) {
      successEl.textContent  = t("account_name_saved");
      successEl.style.display = "block";
    } else {
      errorEl.textContent   = translateError(res.detail);
      errorEl.style.display = "block";
    }
  };

  // Change password
  document.getElementById("pwForm").onsubmit = async e => {
    e.preventDefault();
    const successEl = document.getElementById("pwSuccess");
    const errorEl   = document.getElementById("pwError");
    successEl.style.display = "none";
    errorEl.style.display   = "none";

    const pw   = document.getElementById("password").value;
    const conf = document.getElementById("confirm").value;

    if (pw !== conf) {
      errorEl.textContent   = t("change_pw_mismatch");
      errorEl.style.display = "block";
      return;
    }

    const fd = new FormData();
    fd.append("password", pw);
    fd.append("confirm",  conf);

    const r   = await fetch("/change-password", { method: "POST", body: fd });
    const res = await r.json().catch(() => ({}));

    if (r.ok) {
      successEl.textContent  = t("change_pw_success");
      successEl.style.display = "block";
      document.getElementById("pwForm").reset();
    } else {
      errorEl.textContent   = translateError(res.detail);
      errorEl.style.display = "block";
    }
  };

  // Delete account
  document.getElementById("deleteBtn").onclick = () => {
    document.getElementById("deleteBtn").style.display = "none";
    document.getElementById("deleteConfirmBox").style.display = "block";
  };

  document.getElementById("cancelDeleteBtn").onclick = () => {
    document.getElementById("deleteConfirmBox").style.display = "none";
    document.getElementById("deleteBtn").style.display = "";
  };

  document.getElementById("confirmDeleteBtn").onclick = async () => {
    document.getElementById("confirmDeleteBtn").disabled = true;
    const r = await fetch("/account", { method: "DELETE" });
    if (r.ok) {
      document.querySelector(".container").innerHTML =
        `<section class="panel panel-narrow"><p class="text-muted-sm">${t("account_deleted_msg")}</p></section>`;
      setTimeout(() => { window.location.href = "/"; }, 2500);
    } else {
      const res = await r.json().catch(() => ({}));
      document.getElementById("confirmDeleteBtn").disabled = false;
      alert(translateError(res.detail));
    }
  };
</script>
</body>
</html>
