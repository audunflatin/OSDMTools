<!DOCTYPE html>
<html lang="no" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OSDMTools – Aktivitetslogg</title>

  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/favicon-512x512.png">

  <link rel="stylesheet" href="/static/styles.css?v=32">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('poptoosdm_theme')||'dark')</script>
</head>
<body>

<!-- SIDEBAR -->

<!-- APP_HEADER -->

<div class="container">
  <section class="panel">
    <h2 data-i18n="heading_activity_log">Aktivitetslogg</h2>

    <!-- Filtre -->
    <div class="filter-row">
      <input id="logSearch" type="search" class="search-input" data-i18n-placeholder="log_search_ph" placeholder="Søk e-post…" oninput="onSearch()" />
      <input id="logDateFrom" type="date" class="filter-control" data-i18n-title="log_date_from" onchange="loadLog()" />
      <input id="logDateTo"   type="date" class="filter-control" data-i18n-title="log_date_to" onchange="loadLog()" />
      <select id="logEventType" class="filter-control" onchange="loadLog()"></select>
      <select id="logStatus" class="filter-control" onchange="loadLog()">
        <option value="" data-i18n="log_all_statuses">Alle statuser</option>
        <option value="ok">OK</option>
        <option value="error" data-i18n="log_status_error">Feil</option>
      </select>
      <button class="btn-table" onclick="resetFilter()" data-i18n="log_reset_filter">Nullstill</button>
    </div>

    <!-- Tabell -->
    <div class="table-scroll">
      <table class="data-table">
        <thead>
          <tr>
            <th data-i18n="log_col_time">Tidspunkt</th>
            <th data-i18n="log_col_user">Bruker</th>
            <th data-i18n="log_col_event">Hendelse</th>
            <th class="center" data-i18n="log_col_status">Status</th>
            <th data-i18n="log_col_details">Detaljer</th>
          </tr>
        </thead>
        <tbody id="logTableBody">
          <tr><td colspan="5" class="table-message" data-i18n="log_loading">Laster logg…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div id="logPagination" class="pagination" style="display:none;">
      <button class="btn-table" id="logPrev" onclick="changePage(-1)">&#8592;</button>
      <span id="logPageInfo" class="pagination-info"></span>
      <button class="btn-table" id="logNext" onclick="changePage(1)">&#8594;</button>
    </div>
    <span id="logTotal" class="total-count"></span>

  </section>
</div>

<script src="/static/i18n.js?v=62"></script>
<script src="/static/admin-log.js?v=5"></script>
</body>
</html>
