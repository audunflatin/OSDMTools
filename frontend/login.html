<!DOCTYPE html>
<html lang="no" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="canonical" href="https://osdmtools.com/login" />
  <link rel="stylesheet" href="/static/styles.css?v=32">
  <title>OSDMTools – Logg inn</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0;
    }

    .login-box {
      background: #152535;
      padding: 2.5rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      border-top: 3px solid #ff5959;
      width: 380px;
      max-width: calc(100vw - 2rem);
    }

    .login-box h1 {
      margin: 0 0 2rem 0;
      text-align: center;
      font-size: 1.8rem;
      font-weight: 800;
      color: #ff5959;
      letter-spacing: -0.02em;
    }

    .login-box button[type="submit"] {
      width: 100%;
      margin-top: 2rem;
      padding: 0.7rem;
      font-size: 1rem;
      background: #ff5959;
      border: 2px solid #ff5959;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 700;
    }

    .login-box button[type="submit"]:hover {
      background: #e03e3e;
      border-color: #e03e3e;
    }
  </style>
</head>
<body>

  <!-- Språkvelger øverst til høyre -->
  <div class="lang-selector-fixed">
    <button class="lang-btn" data-lang="no" onclick="setLanguage('no')" title="Norsk">🇳🇴</button>
    <button class="lang-btn" data-lang="en" onclick="setLanguage('en')" title="English">🇬🇧</button>
    <button class="lang-btn" data-lang="de" onclick="setLanguage('de')" title="Deutsch">🇩🇪</button>
    <button class="lang-btn" data-lang="sv" onclick="setLanguage('sv')" title="Svenska">🇸🇪</button>
    <button class="lang-btn" data-lang="fr" onclick="setLanguage('fr')" title="Français">🇫🇷</button>
  </div>

  <form class="login-box" method="post" action="/login">
    <div style="display:flex; justify-content:center; margin-bottom:2rem;">
      <svg width="300" height="60" viewBox="0 0 220 44" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="22" r="9" fill="#ff5959"/>
        <line x1="23" y1="22" x2="35" y2="22" stroke="rgba(255,255,255,0.35)" stroke-width="2.5" stroke-dasharray="3 2"/>
        <circle cx="44" cy="22" r="7" fill="none" stroke="white" stroke-width="2.5"/>
        <text x="60" y="29" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-weight="800" font-size="21" fill="white"><tspan fill="#ff5959">OSDM</tspan>Tools</text>
      </svg>
    </div>

    <label for="email" data-i18n="label_email">E‑post</label>
    <input id="email" name="email" type="email" required />

    <label for="password" data-i18n="label_password">Passord</label>
    <input id="password" name="password" type="password" required />

    <div id="loginError" class="validation-error" style="display:none;"></div>

    <button type="submit" data-i18n="btn_login">Logg inn</button>
    <a href="/forgot-password" style="display:block; text-align:center; margin-top:1rem; font-size:0.875rem; color:rgba(255,255,255,0.5); text-decoration:none;" data-i18n="forgot_pw_link">Glemt passord?</a>
  </form>

<script src="/static/i18n.js?v=62"></script>
<script>
  if (window.LOGIN_ERROR) {
    const el = document.getElementById("loginError");
    el.textContent = translateError({ code: window.LOGIN_ERROR });
    el.style.display = "block";
  }
</script>
</body>
</html>
