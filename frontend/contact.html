<!DOCTYPE html>
<html lang="no" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OSDMTools – Kontakt</title>

  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/favicon-512x512.png">

  <link rel="stylesheet" href="/static/styles.css?v=32">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('poptoosdm_theme')||'dark')</script>
</head>
<body>

<!-- SIDEBAR -->

<!-- APP_HEADER -->

<div class="container">
  <section class="panel">
    <h2 data-i18n="contact_heading">Kontakt</h2>

    <div id="contactSuccess" class="success-msg" style="display:none;"></div>
    <div id="contactError" class="validation-error" style="display:none;"></div>

    <form id="contactForm">
      <label data-i18n="contact_name">Navn</label>
      <input id="contactName" type="text" required />

      <label data-i18n="contact_email">E-post</label>
      <input id="contactEmail" type="email" required readonly />

      <label data-i18n="contact_message">Melding</label>
      <textarea id="contactMessage" rows="5" required
        data-i18n-placeholder="contact_placeholder"></textarea>

      <button type="submit" data-i18n="contact_btn">Send melding</button>
    </form>
  </section>
</div>

<script src="/static/i18n.js?v=62"></script>
<script>

  if (window.USER_EMAIL) {
    document.getElementById("contactEmail").value = window.USER_EMAIL;
  }
  if (window.USER_NAME) {
    document.getElementById("contactName").value = window.USER_NAME;
  }

  document.getElementById("contactForm").onsubmit = async e => {
    e.preventDefault();
    const successEl = document.getElementById("contactSuccess");
    const errorEl   = document.getElementById("contactError");
    successEl.style.display = "none";
    errorEl.style.display   = "none";
    const fd = new FormData();
    fd.append("name",    document.getElementById("contactName").value);
    fd.append("email",   document.getElementById("contactEmail").value);
    fd.append("message", document.getElementById("contactMessage").value);
    const r   = await fetch("/contact", { method: "POST", body: fd });
    const res = await r.json().catch(() => ({}));
    if (res.ok) {
      successEl.textContent = t("contact_sent");
      successEl.style.display = "block";
      document.getElementById("contactForm").reset();
      document.getElementById("contactEmail").value = window.USER_EMAIL || "";
    } else {
      errorEl.textContent = t("contact_error");
      errorEl.style.display = "block";
    }
  };
</script>
</body>
</html>
