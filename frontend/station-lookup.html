<!DOCTYPE html>
<html lang="no" translate="no">
<head>
  <meta charset="UTF-8" />
  <title>OSDMTools – Stasjonssøk</title>

  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/favicon-512x512.png">

  <link rel="stylesheet" href="/static/styles.css?v=28">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('poptoosdm_theme')||'dark')</script>
</head>
<body>

<!-- SIDEBAR -->

<!-- APP_HEADER -->

<div class="container">
  <section class="panel">
    <h2 data-i18n="heading_station_lookup">Stasjonssøk</h2>
    <p style="margin-top:0; color:var(--text-muted); font-size:0.92rem;" data-i18n="station_hint">Søk på stasjonsnavn eller skriv inn en 7-sifret UIC-kode.</p>

    <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
      <input id="searchInput" type="search"
        data-i18n-placeholder="placeholder_station_search"
        placeholder="Søk på navn eller 7-sifret UIC-kode…"
        style="flex:1;"
        onkeydown="if(event.key==='Enter') doSearch()" />
      <button id="searchBtn" onclick="doSearch()" data-i18n="station_search_btn">Søk</button>
    </div>

    <div id="statusMsg" style="display:none; margin-bottom:0.75rem; font-size:0.9rem; color:var(--text-muted);"></div>

    <table id="resultsTable" style="display:none; width:100%; border-collapse:collapse;">
      <thead>
        <tr>
          <th style="text-align:left; padding:6px 8px; border-bottom:2px solid var(--border); font-size:0.82rem; color:var(--text-muted); font-weight:600;" data-i18n="station_col_name">Stasjonsnavn</th>
          <th style="text-align:left; padding:6px 8px; border-bottom:2px solid var(--border); font-size:0.82rem; color:var(--text-muted); font-weight:600;" data-i18n="station_col_country">Land</th>
          <th style="text-align:left; padding:6px 8px; border-bottom:2px solid var(--border); font-size:0.82rem; color:var(--text-muted); font-weight:600;" data-i18n="station_col_uic">UIC-kode</th>
          <th style="border-bottom:2px solid var(--border);"></th>
        </tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </section>
</div>

<script src="/static/i18n.js?v=57"></script>
<script src="/static/stationLookup.js?v=1"></script>
</body>
</html>
