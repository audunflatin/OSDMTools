<!DOCTYPE html>
<html lang="no" translate="no">
<head>
  <meta charset="UTF-8" />
  <title>OSDMTools – Legg til rabatt i OSDM</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/favicon-512x512.png">

  <!-- Styles -->
  <link rel="stylesheet" href="/static/styles.css?v=29">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('poptoosdm_theme')||'dark')</script>
</head>
<body>

<!-- SIDEBAR -->

<!-- APP_HEADER -->

<div class="container">
  <section class="panel">
    <h2 data-i18n="heading_fare_discount">Legg til rabatt</h2>
    <p class="panel-desc" data-i18n="fare_discount_desc">
      Last opp en OSDM fareDelivery JSON-fil for å legge til en ny rabattert fare.
    </p>

    <!-- Steg 1: Last opp fil -->
    <div id="stepUpload">
      <label data-i18n="label_osdm_file_discount">OSDM JSON-fil</label>
      <input id="discountFile" type="file" accept=".json" onchange="onFileChange()" />
      <div id="fileInfo" style="display:none;"></div>
      <div id="parseProgress" class="upload-progress" style="display:none;"></div>
      <div id="parseSummary"></div>
    </div>

    <!-- Steg 2: Skjema (skjult til fil er lastet) -->
    <div id="stepForm" style="display:none; margin-top:2rem;">

      <!-- Strekningsbegrensning -->
      <div>
        <label style="display:block; margin-bottom:0.5rem;" data-i18n="label_route_constraint">Strekningsbegrensning</label>
        <div style="display:flex; gap:0.75rem; margin-bottom:0.75rem; flex-wrap:wrap;">
          <label class="toggle-btn">
            <input type="radio" name="routeMode" value="none" checked onchange="onRouteModeChange()">
            <span data-i18n="opt_no_constraint">Ingen begrensning</span>
          </label>
          <label class="toggle-btn">
            <input type="radio" name="routeMode" value="specific" onchange="onRouteModeChange()">
            <span data-i18n="opt_specific_routes">Spesifikke strekninger</span>
          </label>
        </div>
        <div id="stationPickerWrap" style="display:none;">
          <div id="stationPairsContainer"></div>
          <button type="button" class="btn-sm" onclick="addPair()" style="margin-top:0.5rem; margin-bottom:0;" data-i18n="btn_add_pair">+ Legg til stasjonpar</button>
        </div>
      </div>

      <!-- Transportørbegrensning -->
      <div style="margin-top:1.5rem;">
        <label style="display:block; margin-bottom:0.5rem;" data-i18n="label_carrier_constraint">Transportørbegrensning</label>
        <div style="display:flex; gap:0.75rem; margin-bottom:0.75rem; flex-wrap:wrap;">
          <label class="toggle-btn">
            <input type="radio" name="carrierMode" value="none" checked onchange="onCarrierModeChange()">
            <span data-i18n="opt_no_constraint">Ingen begrensning</span>
          </label>
          <label class="toggle-btn">
            <input type="radio" name="carrierMode" value="specific" onchange="onCarrierModeChange()">
            <span data-i18n="opt_specific_carriers">Spesifikke transportører</span>
          </label>
        </div>
        <div id="carrierPickerWrap" style="display:none;">
          <div class="picker-wrap" id="wrapCarrier">
            <input id="inputCarrier" type="text" autocomplete="off"
              placeholder="Søk transportørnavn eller RICS-kode…"
              data-i18n-placeholder="placeholder_carrier_search"
              oninput="carrierFilter()"
              onkeydown="carrierKey(event)"
              onfocus="carrierOpen()" />
            <div id="dropCarrier" class="picker-dropdown" style="display:none;"></div>
          </div>
          <div id="carrierChips" style="display:flex; flex-wrap:wrap; gap:0.4rem; margin-top:0.5rem;"></div>
        </div>
      </div>

      <!-- Rabattprosent + rabattnavn -->
      <div style="margin-top:1.25rem;">
        <div style="max-width:180px;">
          <label data-i18n="label_discount_pct">Rabatt (%)</label>
          <input id="discountPct" type="number" min="1" max="99" step="1" placeholder="f.eks. 20"
            data-i18n-placeholder="placeholder_discount_pct" />
        </div>
        <div style="margin-top:1rem;">
          <label data-i18n="label_discount_name">Rabattnavn</label>
          <input id="discountName" type="text" placeholder="f.eks. DSB-rabatt 20%"
            data-i18n-placeholder="placeholder_discount_name" />
        </div>
      </div>

      <!-- Passasjerkategorier -->
      <div style="margin-top:1.5rem;">
        <label style="margin-bottom:0.5rem; display:block;" data-i18n="label_passenger_categories">Passasjerkategorier</label>
        <div id="passengerCheckboxes" style="display:flex; flex-wrap:wrap; gap:0.5rem 1.25rem;"></div>
      </div>

      <!-- Serviceklasser -->
      <div style="margin-top:1.5rem;">
        <label style="margin-bottom:0.5rem; display:block;" data-i18n="label_service_class">Serviceklasse</label>
        <div id="serviceClassCheckboxes" style="display:flex; flex-wrap:wrap; gap:0.5rem 1.25rem;"></div>
      </div>

      <div id="validationError" class="validation-error" style="display:none;"></div>

      <button id="applyBtn" onclick="applyDiscount()" class="btn-primary" data-i18n="btn_apply_discount">Generer rabattert fil</button>
      <div id="applyProgress" class="upload-progress" style="display:none;"></div>

      <div id="resultBox" class="status-ok" style="display:none;">
        <div id="finalStatus" class="result-text"></div>
      </div>

      <button id="downloadBtn" onclick="downloadDiscounted()" disabled data-i18n="btn_download">Last ned oppdatert OSDM JSON</button>
      <button id="downloadExcelBtn" onclick="exportExcel('/fare-discount/excel')" disabled data-i18n="btn_download_excel">Last ned Excel</button>
      <div id="spinnerExcel" class="spinner"></div>
    </div>
  </section>
</div>

<script src="/static/i18n.js?v=60"></script>
<script src="/static/common.js?v=5"></script>
<script src="/static/fareDiscount.js?v=20"></script>
</body>
</html>
