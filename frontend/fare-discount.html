<!DOCTYPE html>
<html lang="no" translate="no">
<head>
  <meta charset="UTF-8" />
  <title>OSDMTools – Legg til rabatt i OSDM</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/favicon-512x512.png">

  <!-- Styles -->
  <link rel="stylesheet" href="/static/styles.css?v=28">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('poptoosdm_theme')||'dark')</script>
  <style>
    .picker-wrap { position: relative; }
    .picker-dropdown {
      position: absolute; z-index: 100; top: calc(100% + 2px); left: 0; right: 0;
      background: #1e2a3a; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px; max-height: 220px; overflow-y: auto;
    }
    .picker-option {
      padding: 7px 12px; cursor: pointer; font-size: 0.92rem;
      color: white; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .picker-option:last-child { border-bottom: none; }
    .picker-option:hover, .picker-option.active { background: rgba(255,255,255,0.12); }
    .picker-option .uic { color: rgba(255,255,255,0.4); font-size: 0.8rem; margin-left: 6px; }
    .picker-clear-btn {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: rgba(255,255,255,0.4);
      cursor: pointer; padding: 4px; line-height: 0; margin: 0;
      display: none; align-items: center;
    }
    .picker-clear-btn:hover { color: #ff5959; }
    input[readonly] { cursor: default; padding-right: 2rem; opacity: 1; }
    .picker-chip {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 6px;
      background: rgba(255,255,255,0.12); border-radius: 20px;
      padding: 4px 12px; font-size: 0.9rem; color: white;
    }
    .picker-chip button {
      background: none; border: none; color: rgba(255,255,255,0.5); margin: 0;
      cursor: pointer; padding: 0; line-height: 0;
      display: inline-flex; align-items: center;
    }
    .picker-chip button:hover { color: #ff5959; }
    .pair-row {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .pair-row:last-child { border-bottom: none; }
    .pair-col { flex: 1; }
    .pair-col input { margin-top: 0; }
    .btn-remove-pair { margin: 0; }
    .btn-remove-pair {
      background: none; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
      color: rgba(255,255,255,0.45); cursor: pointer; padding: 0.35rem 0.5rem;
      display: inline-flex; align-items: center; line-height: 0; flex-shrink: 0;
      margin-bottom: 2px;
    }
    .btn-remove-pair:hover { color: #ff5959; border-color: #ff5959; }
    .checkbox-label {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: rgba(255,255,255,0.07); border-radius: 6px;
      padding: 5px 10px; font-size: 0.9rem; color: white; cursor: pointer;
      user-select: none;
    }
    .checkbox-label:hover { background: rgba(255,255,255,0.13); }
    .checkbox-label input[type=checkbox] { accent-color: #ff5959; width: 15px; height: 15px; }
    .toggle-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; padding: 8px 16px; font-size: 0.9rem;
      color: rgba(255,255,255,0.55); cursor: pointer; user-select: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .toggle-btn:hover { background: rgba(255,255,255,0.12); color: white; }
    .toggle-btn input[type=radio] { display: none; }
    .toggle-btn:has(input:checked) {
      background: rgba(255,89,89,0.18); border-color: #ff5959; color: white; font-weight: 600;
    }
    .btn-primary {
      background: #ff5959; color: white; border: none; border-radius: 8px;
      padding: 0.65rem 2rem; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    .btn-primary:hover { background: #e04444; }
    .btn-primary:disabled { opacity: 0.45; cursor: default; }
  </style>
</head>
<body>

<nav class="sidebar">
  <a href="/" class="sidebar-brand">
    <svg width="170" height="34" viewBox="0 0 220 44" xmlns="http://www.w3.org/2000/svg">
      <circle cx="14" cy="22" r="9" fill="#ff5959"/>
      <line x1="23" y1="22" x2="35" y2="22" stroke="rgba(255,255,255,0.35)" stroke-width="2.5" stroke-dasharray="3 2"/>
      <circle cx="44" cy="22" r="7" fill="none" stroke="white" stroke-width="2.5"/>
      <text x="60" y="29" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-weight="800" font-size="21" fill="white"><tspan fill="#ff5959">OSDM</tspan>Tools</text>
    </svg>
  </a>
  <div class="sidebar-nav">
    <a href="/" class="sidebar-link" data-i18n="nav_generate">Priser fra avstandsfil</a>
    <a href="/price-adjust" class="sidebar-link" data-i18n="nav_price_adjust">Prisregulering</a>

    <a href="/osdmtoexcel" class="sidebar-link" data-i18n="nav_osdm_excel">OSDM → Excel</a>
    <a href="/fare-discount" class="sidebar-link active" data-i18n="nav_fare_discount">Legg til rabatt i OSDM</a>
    <a href="/fix-osdm" class="sidebar-link" data-i18n="nav_fix_osdm">Rydd opp i OSDM</a>
    <a href="/osdm-editor" class="sidebar-link" style="display:flex;align-items:center;justify-content:space-between;"><span data-i18n="nav_osdm_editor">OSDM-editor</span><span class="beta-tag">BETA</span></a>
    <a href="/stasjonssok" class="sidebar-link" data-i18n="nav_station_lookup">Stasjonssøk</a>
    <a href="/kontakt" class="sidebar-link" data-i18n="nav_contact">Kontakt</a>
    <a href="/min-konto" class="sidebar-link" data-i18n="nav_my_account">Endre passord</a>
    <a id="adminLink" href="/admin/users" class="sidebar-link" data-i18n="nav_admin" style="display:none;">Admin</a>
    <div id="adminSubmenu" style="display:none; flex-direction:column; gap:1px;">
      <a href="/admin/users" class="sidebar-sublink" style="display:flex; align-items:center; justify-content:space-between;">
        <span data-i18n="nav_admin_users">Brukere</span>
        <span id="sidebarPendingBadge" style="display:none; background:var(--coral); color:white; border-radius:9999px; font-size:0.65rem; font-weight:700; padding:1px 7px; line-height:1.6;"></span>
      </a>
      <a href="/admin/log" class="sidebar-sublink" data-i18n="nav_admin_log">Logg</a>
      <a href="/admin/presentation" class="sidebar-sublink" data-i18n="nav_admin_presentation">Presentasjon</a>
    </div>
  </div>
</nav>

<header class="app-header">
  <span class="lang-selector">
    <button class="theme-btn" id="themeToggle" onclick="toggleTheme()"><!-- filled by JS --></button>
    <span style="width:4px;display:inline-block;"></span>
    <button class="lang-btn" data-lang="no" onclick="setLanguage('no')" title="Norsk">🇳🇴</button>
    <button class="lang-btn" data-lang="en" onclick="setLanguage('en')" title="English">🇬🇧</button>
    <button class="lang-btn" data-lang="de" onclick="setLanguage('de')" title="Deutsch">🇩🇪</button>
    <button class="lang-btn" data-lang="sv" onclick="setLanguage('sv')" title="Svenska">🇸🇪</button>
    <button class="lang-btn" data-lang="fr" onclick="setLanguage('fr')" title="Français">🇫🇷</button>
    <span class="lang-sep">|</span>
    <a href="/logout" class="logout-button" data-i18n="logout">Logg ut</a>
  </span>
</header>

<div class="container">
  <section class="panel">
    <h2 data-i18n="heading_fare_discount">Legg til rabatt</h2>
    <p style="color:var(--text-muted); margin-bottom:1.5rem;" data-i18n="fare_discount_desc">
      Last opp en OSDM fareDelivery JSON-fil for å legge til en ny rabattert fare.
    </p>

    <!-- Steg 1: Last opp fil -->
    <div id="stepUpload">
      <label data-i18n="label_osdm_file_discount">OSDM JSON-fil</label>
      <input id="discountFile" type="file" accept=".json" onchange="onFileChange()" />
      <div id="fileInfo" style="display:none; margin-top:0.5rem; color:var(--text-muted); font-size:0.9rem;"></div>
      <div id="parseProgress" style="display:none; margin-top:0.75rem;">
        <div style="height:6px; background:var(--spinner-ring); border-radius:3px; overflow:hidden;">
          <div class="progress-fill" style="height:100%; background:#ff5959; border-radius:3px; transition:width 0.5s ease; width:0%;"></div>
        </div>
        <div style="display:flex; gap:0.75rem; align-items:center; margin-top:0.4rem; font-size:0.8rem; color:var(--text-muted);">
          <span class="spinner-sm"></span>
          <span class="progress-pct">0%</span>
          <span class="progress-stage"></span>
        </div>
      </div>
    </div>

    <!-- Steg 2: Skjema (skjult til fil er lastet) -->
    <div id="stepForm" style="display:none; margin-top:2rem;">
      <p id="parsedInfo" style="color:var(--text-muted); font-size:0.85rem; margin-bottom:1.5rem;"></p>

      <!-- Strekningsbegrensning -->
      <div>
        <label style="display:block; margin-bottom:0.5rem;" data-i18n="label_route_constraint">Strekningsbegrensning</label>
        <div style="display:flex; gap:0.75rem; margin-bottom:0.75rem; flex-wrap:wrap;">
          <label class="toggle-btn">
            <input type="radio" name="routeMode" value="none" checked onchange="onRouteModeChange()">
            <span data-i18n="opt_no_constraint">Ingen begrensning</span>
          </label>
          <label class="toggle-btn">
            <input type="radio" name="routeMode" value="specific" onchange="onRouteModeChange()">
            <span data-i18n="opt_specific_routes">Spesifikke strekninger</span>
          </label>
        </div>
        <div id="stationPickerWrap" style="display:none;">
          <div id="stationPairsContainer"></div>
          <button type="button" class="btn-sm" onclick="addPair()" style="margin-top:0.5rem; margin-bottom:0;" data-i18n="btn_add_pair">+ Legg til stasjonpar</button>
        </div>
      </div>

      <!-- Transportørbegrensning -->
      <div style="margin-top:1.5rem;">
        <label style="display:block; margin-bottom:0.5rem;" data-i18n="label_carrier_constraint">Transportørbegrensning</label>
        <div style="display:flex; gap:0.75rem; margin-bottom:0.75rem; flex-wrap:wrap;">
          <label class="toggle-btn">
            <input type="radio" name="carrierMode" value="none" checked onchange="onCarrierModeChange()">
            <span data-i18n="opt_no_constraint">Ingen begrensning</span>
          </label>
          <label class="toggle-btn">
            <input type="radio" name="carrierMode" value="specific" onchange="onCarrierModeChange()">
            <span data-i18n="opt_specific_carriers">Spesifikke transportører</span>
          </label>
        </div>
        <div id="carrierPickerWrap" style="display:none;">
          <div class="picker-wrap" id="wrapCarrier">
            <input id="inputCarrier" type="text" autocomplete="off"
              placeholder="Søk transportørnavn eller RICS-kode…"
              data-i18n-placeholder="placeholder_carrier_search"
              oninput="carrierFilter()"
              onkeydown="carrierKey(event)"
              onfocus="carrierOpen()" />
            <div id="dropCarrier" class="picker-dropdown" style="display:none;"></div>
          </div>
          <div id="carrierChips" style="display:flex; flex-wrap:wrap; gap:0.4rem; margin-top:0.5rem;"></div>
        </div>
      </div>

      <!-- Rabattprosent + rabattnavn -->
      <div style="margin-top:1.25rem;">
        <div style="max-width:180px;">
          <label data-i18n="label_discount_pct">Rabatt (%)</label>
          <input id="discountPct" type="number" min="1" max="99" step="1" placeholder="f.eks. 20"
            data-i18n-placeholder="placeholder_discount_pct" />
        </div>
        <div style="margin-top:1rem;">
          <label data-i18n="label_discount_name">Rabattnavn</label>
          <input id="discountName" type="text" placeholder="f.eks. DSB-rabatt 20%"
            data-i18n-placeholder="placeholder_discount_name" />
        </div>
      </div>

      <!-- Passasjerkategorier -->
      <div style="margin-top:1.5rem;">
        <label style="margin-bottom:0.5rem; display:block;" data-i18n="label_passenger_categories">Passasjerkategorier</label>
        <div id="passengerCheckboxes" style="display:flex; flex-wrap:wrap; gap:0.5rem 1.25rem;"></div>
      </div>

      <!-- Serviceklasser -->
      <div style="margin-top:1.5rem;">
        <label style="margin-bottom:0.5rem; display:block;" data-i18n="label_service_class">Serviceklasse</label>
        <div id="serviceClassCheckboxes" style="display:flex; flex-wrap:wrap; gap:0.5rem 1.25rem;"></div>
      </div>

      <!-- Submit -->
      <div style="margin-top:2rem;">
        <button id="applyBtn" onclick="applyDiscount()" class="btn-primary" data-i18n="btn_apply_discount">Generer rabattert fil</button>
      </div>
    </div>

    <pre id="discountResult" style="margin-top:1.5rem;"></pre>
  </section>
</div>

<script src="/static/i18n.js?v=57"></script>
<script src="/static/fareDiscount.js?v=19"></script>
<script>
  if (window.IS_ADMIN) {
    const el = document.getElementById("adminLink"); if (el) el.style.display = "";
    const sub = document.getElementById("adminSubmenu"); if (sub) sub.style.display = "flex";
  }
</script>
</body>
</html>
